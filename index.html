el Ekskul","Menyimpan daftar ekskul dipisahkan koma pada tabel Siswa","Membuat tabel Keanggotaan(id_siswa, id_ekskul, tanggal_gabung) dengan dua foreign key","Menggabungkan tabel Siswa dan Ekskul menjadi satu tabel"],"d"],["Tabel `Nilai(nis, kode_mapel, nama_mapel, nilai)` memiliki primary key gabungan (nis, kode_mapel). Hasil analisis normalisasi yang benar adalah…",["Melanggar 2NF karena nama_mapel hanya bergantung pada sebagian primary key","Melanggar 1NF karena primary key terdiri atas dua kolom","Melanggar 2NF karena nilai bergantung pada nis dan kode_mapel","Melanggar 1NF karena nama_mapel bertipe teks","Sudah memenuhi 3NF karena memiliki primary key"],"a"],["Tabel `siswa(nis, kelas, nilai)` akan digunakan untuk menampilkan kelas yang rata-rata nilainya di atas 75. Query yang tepat adalah…",["`SELECT kelas, AVG(nilai) FROM siswa WHERE AVG(nilai) > 75 GROUP BY kelas;`","`SELECT kelas, AVG(nilai) FROM siswa WHERE nilai > 75 GROUP BY kelas;`","`SELECT kelas, AVG(nilai) FROM siswa HAVING nilai > 75;`","`SELECT kelas, nilai FROM siswa ORDER BY nilai > 75;`","`SELECT kelas, AVG(nilai) FROM siswa GROUP BY kelas HAVING AVG(nilai) > 75;`"],"e"],["Admin hanya ingin mengubah harga produk ber-id 7, tetapi menjalankan `UPDATE produk SET harga = 50000;`. Analisis yang benar adalah…",["Query gagal; admin perlu menambahkan ORDER BY id","Hanya baris pertama berubah; admin perlu menambahkan LIMIT 7","Harga semua produk berubah; query seharusnya memakai WHERE id = 7","Muncul baris baru; admin seharusnya memakai INSERT","Hanya produk ber-id 7 berubah karena ada primary key"],"c"],["Perpustakaan ingin menampilkan semua anggota, termasuk yang belum pernah meminjam buku. Query yang tepat adalah…",["`SELECT a.nama, p.id_pinjam FROM anggota a LEFT JOIN pinjam p ON a.id_anggota = p.id_anggota;`","`SELECT a.nama, p.id_pinjam FROM anggota a INNER JOIN pinjam p ON a.id_anggota = p.id_anggota;`","`SELECT a.nama, p.id_pinjam FROM pinjam p LEFT JOIN anggota a ON a.id_anggota = p.id_anggota;`
